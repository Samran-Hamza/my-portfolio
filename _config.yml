# Site settings
title: Hamza Samran
first_name: Hamza
middle_name: ""
last_name: Samran
description: > 
  Software Engineer | Web & Android Developer | Project Manager
footer_text: > 
  © Hamza Samran
keywords: software engineer, web developer, android developer, project manager, react, kotlin
lang: en
icon: ⚛️

url: https://samran-hamza.github.io
baseurl: "/my-portfolio"
last_updated: true
back_to_top: true

# Theme settings
repo_theme_light: default
repo_theme_dark: dark
repo_trophies:
  enabled: true
  theme_light: flat
  theme_dark: gitdimmed

# Layout
navbar_fixed: true
footer_fixed: true
search_enabled: true
socials_in_search: true
posts_in_search: true
bib_search: true
max_width: 930px

# Social
email: mshmizi@gmail.com
github_username: Samran-Hamza
linkedin_username: hamza-samran

# Blog
blog_name: Hamza Samran
blog_description: Software Engineer | Web & Android Developer
permalink: /blog/:year/:title/
pagination:
  enabled: true
related_blog_posts:
  enabled: true
  max_related: 5

# Collections
collections:
  books:
    output: true
  news:
    defaults:
      layout: post
    output: true
  projects:
    output: true
  teachings:
    output: true

# Jekyll settings
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter_opts:
    css_class: "highlight"
    span:
      line_numbers: false
    block:
      line_numbers: false
      start_line: 1

include: ["_pages"]
exclude:
  - al-folio-upgrade-report.md
  - bin/
  - CONTRIBUTING.md
  - CUSTOMIZE.md
  - Dockerfile
  - docker-compose.yml
  - docs/
  - FAQ.md
  - Gemfile
  - Gemfile.lock
  - INSTALL.md
  - LICENSE
  - lighthouse_results/
  - package.json
  - package-lock.json
  - _pages/about_einstein.md
  - purgecss.config.js
  - README.md
  - readme_preview/
  - gems/
  - migrations/
  - vendor
keep_files:
  - CNAME
  - .nojekyll

theme: al_folio_core

plugins:
  - jekyll-3rd-party-libraries
  - jekyll-archives-v2
  - jekyll-cache-bust
  - jekyll-email-protect
  - jekyll-feed
  - jekyll-get-json
  - jekyll-imagemagick
#  - jekyll-jupyter-notebook
  - jekyll-link-attributes
  - jekyll-minifier
  - jekyll-paginate-v2
#  - jekyll-regex-replace
  - jekyll/scholar
  - jekyll-sitemap
  - jekyll-socials
  - jekyll-tabs
  - jekyll-terser
  - jekyll-toc
  - jekyll-twitter-plugin
  - jemoji
  - al_folio_core
  - al_icons
  - al_folio_cv
  - al_folio_distill
  - al_folio_upgrade
  - al_folio_bootstrap_compat
  - al_cookie
  - al_analytics
  - al_citations
  - al_img_tools
  - al_search
  - al_charts
  - al_math
  - al_comments
  - al_newsletter

# Third party libraries
third_party_libraries: {}

# Sitemap
defaults:
  - scope:
      path: "assets"
    values:
      sitemap: false

sass:
  style: compressed

# Imagemagick
imagemagick:
  enabled: false

# Terser
terser:
  compress:
    drop_console: true

# Jekyll Archives
jekyll-archives:
  posts:
    enabled: [year, tags, categories]
    permalinks:
      year: "/blog/:year/"
      tags: "/blog/:type/:name/"
      categories: "/blog/:type/:name/"
  books:
    enabled: [year, tags, categories]

display_tags: ["images", "links","code"]

# Jekyll Scholar
scholar:
  last_name: [Samran]
  first_name: [Hamza]
  style: apa
  locale: en
  source: /_bibliography/
  bibliography: papers.bib
  bibliography_template: bib
  bibtex_filters: [latex, smallcaps, superscript]
  replace_strings: true
  join_strings: true
  details_dir: bibliography
  details_link: Details
  query: "@*"
  group_by: year
  group_order: descending

enable_publication_badges:
  altmetric: true
  dimensions: true
  google_scholar: true
  inspirehep: true

filtered_bibtex_keywords:
  [abbr, abstract, additional_info, altmetric, annotation, arxiv, award,
   award_name, bibtex_show, blog, code, dimensions, eprint, google_scholar_id,
   hal, html, inspirehep_id, pdf, pmid, poster, preview, selected, slides, supp,
   video, website]

max_author_limit: 3
more_authors_animation_delay: 10
enable_publication_thumbnails: true

# Jekyll Link Attributes
external_links:
  enabled: true
  rel: external nofollow noopener
  target: _blank
  exclude:

# Optional Features
enable_google_verification: false
enable_bing_verification: false
enable_cookie_consent: false
enable_masonry: true
enable_math: true
enable_tooltips: false
enable_darkmode: true
enable_navbar_social: false
enable_project_categories: true
enable_medium_zoom: true
enable_progressbar: true
enable_video_embedding: false
external_services:
  github_readme_stats_url: https://github-readme-stats.vercel.app
